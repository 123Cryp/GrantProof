name: Unzip uploaded archive

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip files from the repository root
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip file in the repository root"
            exit 0
          fi
          for z in "${zips[@]}"; do
            unzip -o -q "$z" -x ".github/*" "__MACOSX/*"
            git rm -q -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack uploaded archive" || echo "Nothing to commit"
          git push

      - name: Run offline tests
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -p "test_*.py" -v
          fi
